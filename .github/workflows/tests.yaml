name: Main pipeline
on: [push, pull_request]
jobs:
    Tests:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php-versions: ['8.3', '8.4', '8.5']
                guzzle-version: ['^7.0', '^8.0']
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v5
              with:
                  path: vendor
                  key: composer-cache-${{ matrix.guzzle-version }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      composer-cache-${{ matrix.guzzle-version }}-

            - name: Install dependencies
              run: composer install --prefer-dist

            - name: Require Guzzle ${{ matrix.guzzle-version }}
              run: composer require "guzzlehttp/guzzle:${{ matrix.guzzle-version }}" --no-interaction --no-scripts -W

            - name: Run tests
              run: composer test
